<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

<head>
  {{ partial "meta.html" . }}
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  {{ partial "css.html" . }}
</head>

<body>
  <!-- Preloader -->
  {{- if not hugo.IsServer }}
  <div id="preloader">
    <div id="status"></div>
  </div>
  {{- end }}

  {{ block "main" . }}
  {{ end }}

  <!-- Back To Top Button -->
  <div id="backtotop"><a href="#"></a></div>

  {{ if .Site.Params.sidebar }}
  {{ partial "sidebar.html" . }}
  {{ end }}

  {{ partial "javascript.html" . }}
</body>

</html>
